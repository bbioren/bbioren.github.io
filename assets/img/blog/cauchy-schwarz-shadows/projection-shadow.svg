<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <!-- right triangle O, P, tip of u -->
  <path d="M80,320 L410,320 L410,100 Z" fill="#bee3f8" fill-opacity="0.6"/>
  <!-- line spanned by v -->
  <line x1="30" y1="320" x2="610" y2="320" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- the shadow: projection of u onto v -->
  <line x1="80" y1="320" x2="410" y2="320" stroke="#dd6b20" stroke-width="10" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- v -->
  <line x1="80" y1="320" x2="518" y2="320" stroke="#222" stroke-width="2.2" marker-end="url(#ah-ink)"/>
  <!-- u -->
  <line x1="80" y1="320" x2="408.3" y2="101.1" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <!-- u - proj (perpendicular drop) -->
  <line x1="410" y1="320" x2="410" y2="104" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- right-angle mark -->
  <path d="M394,320 L394,304 L410,304" fill="none" stroke="#222" stroke-width="1.5"/>
  <!-- points -->
  <circle cx="80" cy="320" r="4" fill="#222"/>
  <circle cx="410" cy="320" r="4" fill="#dd6b20"/>
  <!-- labels -->
  <text x="62" y="342" font-size="16" fill="#222">0</text>
  <text x="215" y="196" font-size="20" font-style="italic" fill="#2b6cb0">u</text>
  <text x="528" y="326" font-size="20" font-style="italic" font-weight="bold" fill="#222">v</text>
  <text x="422" y="215" font-size="16" fill="#2b6cb0"><tspan font-style="italic">u</tspan> − proj</text>
  <text x="245" y="350" font-size="16" fill="#dd6b20" text-anchor="middle">proj = (⟨<tspan font-style="italic">u</tspan>,<tspan font-style="italic">v</tspan>⟩ / ‖<tspan font-style="italic">v</tspan>‖²) <tspan font-style="italic">v</tspan></text>
  <text x="245" y="374" font-size="15" fill="#dd6b20" text-anchor="middle">length = |⟨<tspan font-style="italic">u</tspan>,<tspan font-style="italic">v</tspan>⟩| / ‖<tspan font-style="italic">v</tspan>‖</text>
  <text x="30" y="42" font-size="17" fill="#222">‖<tspan font-style="italic">u</tspan>‖² = ‖proj‖² + ‖<tspan font-style="italic">u</tspan> − proj‖²  ≥  ‖proj‖²</text>
  <text x="30" y="66" font-size="14" fill="#4a5568">hypotenuse ≥ leg: the shadow is never longer than the object</text>
</svg>
