<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 655" font-family="Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dd6b20"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0aec0"/></marker>
  </defs>
  <!-- axes: 1 unit = 100px, origin at (80,470) -->
  <line x1="80" y1="470" x2="690" y2="470" stroke="#a0aec0" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="80" y1="470" x2="80" y2="35" stroke="#a0aec0" stroke-width="2" marker-end="url(#ag)"/>
  <text x="680" y="496" font-size="16" fill="#4a5568">x₁</text>
  <text x="52" y="48" font-size="16" fill="#4a5568">x₂</text>
  <text x="62" y="492" font-size="15" fill="#4a5568">0</text>
  <!-- span(1): the diagonal -->
  <line x1="80" y1="470" x2="515" y2="35" stroke="#a0aec0" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="470" y="40" font-size="16" fill="#4a5568" text-anchor="end">span(𝟏): the diagonal</text>
  <!-- triangle: mu1=(1,1)->(180,370), xbar1=(3.5,3.5)->(430,120), X=(4.5,2.5)->(530,220) -->
  <polygon points="180,370 430,120 530,220" fill="#feebc8" fill-opacity="0.45" stroke="none"/>
  <line x1="180" y1="370" x2="425" y2="125" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="430" y1="120" x2="525" y2="215" stroke="#dd6b20" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="180" y1="370" x2="523" y2="223" stroke="#222" stroke-width="2.5" marker-end="url(#ak)"/>
  <!-- right angle at xbar1 -->
  <polyline points="412.3,137.7 430,155.4 447.7,137.7" fill="none" stroke="#222" stroke-width="1.8"/>
  <!-- points -->
  <circle cx="180" cy="370" r="5.5" fill="#222"/>
  <circle cx="430" cy="120" r="5.5" fill="#2b6cb0"/>
  <circle cx="530" cy="220" r="5.5" fill="#dd6b20"/>
  <text x="168" y="395" font-size="17" fill="#222" text-anchor="end">μ𝟏 = (μ, μ)</text>
  <text x="418" y="108" font-size="17" fill="#2b6cb0" text-anchor="end">X̄𝟏 = (X̄, X̄)</text>
  <text x="544" y="214" font-size="17" fill="#dd6b20">X = (X₁, X₂)</text>
  <!-- edge labels -->
  <text x="268" y="236" font-size="16" fill="#2b6cb0" text-anchor="end">(X̄ − μ)𝟏</text>
  <text x="492" y="156" font-size="16" fill="#dd6b20">X − X̄𝟏</text>
  <text x="372" y="322" font-size="16" fill="#222">X − μ𝟏</text>
  <!-- legend -->
  <rect x="20" y="510" width="680" height="128" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2"/>
  <line x1="40" y1="538" x2="70" y2="538" stroke="#2b6cb0" stroke-width="3"/>
  <text x="82" y="543" font-size="15" fill="#222">‖(X̄−μ)𝟏‖² = n(X̄−μ)²</text>
  <text x="400" y="543" font-size="15" fill="#222">1 dimension, mean σ²</text>
  <line x1="40" y1="568" x2="70" y2="568" stroke="#dd6b20" stroke-width="3"/>
  <text x="82" y="573" font-size="15" fill="#222">‖X−X̄𝟏‖² = Σ(Xᵢ−X̄)²</text>
  <text x="400" y="573" font-size="15" fill="#222">n−1 dimensions, mean (n−1)σ²</text>
  <line x1="40" y1="598" x2="70" y2="598" stroke="#222" stroke-width="2.5"/>
  <text x="82" y="603" font-size="15" fill="#222">‖X−μ𝟏‖² = Σ(Xᵢ−μ)²</text>
  <text x="400" y="603" font-size="15" fill="#222">n dimensions, mean nσ²</text>
  <text x="40" y="628" font-size="14" fill="#4a5568">right angle at X̄𝟏, so black² = blue² + orange² (drawn for n = 2)</text>
</svg>
