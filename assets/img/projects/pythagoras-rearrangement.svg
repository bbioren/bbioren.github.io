      <polygon points="60,410 240,410 60,290"/>
      <polygon points="360,410 360,230 240,410"/>
      <polygon points="360,110 180,110 360,230"/>
      <polygon points="60,110 60,290 180,110"/>
    </g>
    <polygon points="240,410 360,230 180,110 60,290" fill="none" stroke="#dd6b20" stroke-width="3"/>
    <rect x="60" y="110" width="300" height="300" fill="none" stroke="#1d2a44" stroke-width="4"/>

    <rect x="440" y="110" width="300" height="300" fill="#feebc8"/>
