    <rect x="440" y="110" width="300" height="300" fill="none" stroke="#1d2a44" stroke-width="4"/>

    <path d="M378 260 L422 260 M408 248 L422 260 L408 272" fill="none" stroke="#1d2a44" stroke-width="3"/>
  </g>
  <g font-family="monospace" font-weight="bold" text-anchor="middle" fill="#dd6b20">
    <text x="210" y="270" font-size="34">c²</text>
    <text x="530" y="330" font-size="34">a²</text>
    <text x="680" y="182" font-size="30">b²</text>
  </g>
  <text x="400" y="70" font-family="monospace" font-size="32" text-anchor="middle" fill="#1d2a44">a² + b² = c²</text>
  <g font-family="monospace" font-size="22" text-anchor="middle" fill="#1d2a44">
    <text x="150" y="445">a</text>
    <text x="300" y="445">b</text>
    <text x="530" y="445">a</text>
    <text x="680" y="445">b</text>
