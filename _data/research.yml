# "What's next" open questions, in the home page's problem style.
next:
  - question: Matching the embedding of a visible attack wasn't enough to make the model comply. What is the language model reading off the image that the CLIP embedding doesn't capture?
    from: the minimal perturbation paper
  - question: The signal that predicts a hallucination shows up while the model is still reading the image. Can we steer on it early enough that the model never commits to the wrong answer?
    from: RAIVN
  - question: Do hallucination detectors built on everyday photos still work on medical images, where a wrong answer costs much more?
    from: RAIVN and Rad Onc
  - question: How much of a textbook can be formalized in notation a mathematician would recognize, and where does Lean force you to write something no textbook would?
    from: Math AI Lab
