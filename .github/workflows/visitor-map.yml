name: Update visitor map

on:
  schedule:
    - cron: "17 9 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch visitor countries from GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 scripts/fetch_visitors.py
      - name: Commit if changed
        run: |
          if git diff --quiet _data/visitors.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "visitor-map bot"
          git config user.email "actions@users.noreply.github.com"
          git add _data/visitors.json
          git commit -m "update visitor map data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        id: commit
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
